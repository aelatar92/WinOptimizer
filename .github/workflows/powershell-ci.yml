name: PowerShell CI

on:
  push:
    branches: [ main, v2.1-smart-ux-safety ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell Gallery
      shell: pwsh
      run: |
        Write-Host "Setting up PowerShell Gallery..." -ForegroundColor Cyan
        Install-PackageProvider -Name NuGet -Force -Scope CurrentUser | Out-Null
        Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction SilentlyContinue

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: |
        Write-Host "Installing PSScriptAnalyzer..." -ForegroundColor Cyan
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck

    - name: Install Pester
      shell: pwsh
      run: |
        Write-Host "Installing Pester..." -ForegroundColor Cyan
        Install-Module -Name Pester -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck

    - name: Run PSScriptAnalyzer (Report Only - v2.2 Development)
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "[v2.2 Restructure] Running PSScriptAnalyzer in report mode..." -ForegroundColor Cyan
        $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
        if ($issues) {
            $issues | Format-Table -AutoSize
            Write-Warning "Found $($issues.Count) issue(s). These will be addressed during v2.2 restructure."
        } else {
            Write-Host "No linting issues found." -ForegroundColor Green
        }

    - name: Run Pester Tests
      shell: pwsh
      run: |
        Write-Host "Running Pester tests..." -ForegroundColor Cyan
        $config = New-PesterConfiguration
        $config.Run.Path = '.\Tests'
        $config.Output.Verbosity = 'Detailed'
        Invoke-Pester -Configuration $config

name: PowerShell CI

on:
  push:
    branches: [ main, v2.1-smart-ux-safety ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -Force -Scope CurrentUser -AllowClobber -SkipPublisherCheck

    - name: Run PSScriptAnalyzer (Report Only)
      shell: pwsh
      continue-on-error: true
      run: |
        Write-Host "Running PSScriptAnalyzer (Report Mode during restructure)..." -ForegroundColor Cyan
        $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
        if ($issues) {
            $issues | Format-Table -AutoSize
            Write-Warning "PSScriptAnalyzer found $($issues.Count) issue(s). Review above. CI will not fail on warnings during v2.2 restructure."
        } else {
            Write-Host "No linting issues found." -ForegroundColor Green
        }

    - name: Run Pester Tests
      shell: pwsh
      run: |
        Write-Host "Running Pester tests..." -ForegroundColor Cyan
        $config = New-PesterConfiguration
        $config.Run.Path = '.\Tests'
        $config.Output.Verbosity = 'Detailed'
        Invoke-Pester -Configuration $config
